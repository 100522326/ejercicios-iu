<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 - Formulario de Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo/ej5.css">
</head>
<body>
  <form action="#" method="post">
    <img src="imagenes/logo.png" alt="Logo Santa Vista">
    <h1>Crea tu cuenta</h1>

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" pattern=".{8,}" required>

    <button type="submit">Registrarme</button>
  </form>
</body>
</html>
