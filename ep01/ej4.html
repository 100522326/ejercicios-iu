<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 4 - Tarjeta Interactiva</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo/ej4.css">
</head>
<body>
  <div class="tarjeta">
    <!-- subcontenedor que gira -->
    <div class="tarjeta-interior">
      <article class="cara frontal">
        <img src="imagenes/abrigo.jpg" alt="Abrigo de lana">
        <div class="info">
          <h2>Abrigo de lana beige</h2>
          <p class="precio">89,95 €</p>
        </div>
      </article>
      <article class="cara trasera">
        <h2>Abrigo de lana beige</h2>
        <p class="precio">89,95 €</p>
        <h3>Composición</h3>
        <ul>
          <li><span>Lana</span> <span>70%</span></li>
          <li><span>Poliéster</span> <span>25%</span></li>
          <li><span>Elastano</span> <span>5%</span></li>
        </ul>
      </article>
    </div>
  </div>
</body>
</html>
